version: '3.8'

services:
  kafka:
    image: wurstmeister/kafka:2.13-2.8.1
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1

      # Connect Docker Kafka to LOCAL zookeeper
      KAFKA_ZOOKEEPER_CONNECT: 10.111.80.166:2181

      # Advertise Kafka correctly to your host machine
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://10.111.80.166:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092

      # Required for wurstmeister images
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  default:
    driver: bridge
